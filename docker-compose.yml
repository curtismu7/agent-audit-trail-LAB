# OrbStack:  HOST_PORT=6600 docker compose up --build -d   ->  http://127.0.0.1:6600/api/health
# The server binds 0.0.0.0 INSIDE the container (AUDIT_TRAIL_BIND is the opt-in), but the port is published on loopback only.
# No host mounts, no docker socket, no host network. Do not change the 127.0.0.1 below. HOST_PORT must stay in 6600-6649.
name: agent-audit-trail-lab

services:
  agent-audit-trail-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-6600}:6600"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      AUDIT_TRAIL_PORT: "6600"
      AUDIT_TRAIL_BIND: 0.0.0.0
      # The name the family lab-proxy (https://local.ping-devops.com:8443) sends in Host; loopback always works.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-agent-audit-trail-lab.local.ping-devops.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6600/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
